# =========================================================
# Application
# =========================================================
spring.application.name=booking_service
server.port=8082


# =========================================================
# PostgreSQL
# Compose injects the postgres service DNS name here; localhost is only for
# local development when the app runs outside Docker.
# =========================================================
spring.datasource.url=${BOOKING_DB_URL:jdbc:postgresql://localhost:5432/booking_service}
spring.datasource.username=${BOOKING_DB_USERNAME:postgres}
spring.datasource.password=${BOOKING_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${BOOKING_DB_POOL_SIZE:20}


# =========================================================
# JPA / Hibernate
# Schema is managed by Flyway migrations (see db/migration); Hibernate only
# validates that the entities match what Flyway created, it never alters the
# schema itself.
# =========================================================
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate


# =========================================================
# Flyway
# baseline-on-migrate lets an existing dev DB (previously managed by
# ddl-auto=update, so it already has these tables) adopt V1 as a baseline
# instead of failing on "relation already exists"; a fresh DB just runs V1
# normally since there's nothing to baseline.
# =========================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true


# =========================================================
# Notification Service
# =========================================================
notification.service.url=http://notification-service:8081


# =========================================================
# Redis
# =========================================================
spring.redis.host=redis
spring.redis.port=6379
spring.data.redis.repositories.enabled=false


# =========================================================
# JWT
# Signing key is issued/owned by auth-service; this service only verifies
# tokens. No insecure literal default - the env var is required so a missing
# secret fails startup loudly instead of silently running with a known key.
# =========================================================
JWT_SECRET=${JWT_SECRET}
JWT_EXPIRATION=86400000


# =========================================================
# Dataset
# =========================================================
app.dataset.path=${APP_DATASET_PATH:classpath:railway-data.csv}

app.dataset.import.enabled=${APP_ELASTICSEARCH_IMPORT_ENABLED:true}

app.dataset.import.clear-existing=${APP_ELASTICSEARCH_IMPORT_FORCE:false}


# =========================================================
# Elasticsearch
# =========================================================
spring.elasticsearch.uris=${ELASTICSEARCH_URL:http://elasticsearch:9200}

app.elasticsearch.import.enabled=${APP_ELASTICSEARCH_IMPORT_ENABLED:true}

app.elasticsearch.import.on-startup=${APP_ELASTICSEARCH_IMPORT_ON_STARTUP:true}

app.elasticsearch.import.force=${APP_ELASTICSEARCH_IMPORT_FORCE:false}

app.elasticsearch.import.csv-path=${APP_ELASTICSEARCH_IMPORT_CSV_PATH:classpath:railway-data.csv}


# =========================================================
# Actuator
# =========================================================
management.endpoints.web.exposure.include=health

management.endpoint.health.show-details=when-authorized


# =========================================================
# Ticket Reminder
# =========================================================
ticket.reminder.enabled=${TICKET_REMINDER_ENABLED:true}

ticket.reminder.cron=${TICKET_REMINDER_CRON:0 0 * * * ?}

ticket.reminder.days-before=${TICKET_REMINDER_DAYS_BEFORE:1}


# =========================================================
# Timezone
# =========================================================
app.timezone=${APP_TIMEZONE:Asia/Kolkata}


# =========================================================
# Caching
# =========================================================
app.cache.station-suggestions-ttl-hours=${APP_CACHE_STATION_TTL_HOURS:24}


# =========================================================
# Seat holds - PENDING_PAYMENT bookings release automatically if payment
# isn't confirmed within hold-ttl-minutes (see SeatHoldService, which sets the
# Redis marker TTL, and BookingService.expireUnpaidHolds, the durable sweep).
# =========================================================
app.booking.hold-ttl-minutes=${APP_BOOKING_HOLD_TTL_MINUTES:5}
app.booking.hold-sweep-interval-ms=${APP_BOOKING_HOLD_SWEEP_INTERVAL_MS:30000}


# =========================================================
# Rate limiting (Redis-backed fixed window, see RateLimitFilter)
# =========================================================
app.ratelimit.booking.enabled=${APP_RATELIMIT_BOOKING_ENABLED:true}
app.ratelimit.booking.max-requests=${APP_RATELIMIT_BOOKING_MAX_REQUESTS:5}
app.ratelimit.booking.window-seconds=${APP_RATELIMIT_BOOKING_WINDOW_SECONDS:10}


# =========================================================
# Kafka
# =========================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# KafkaProducer.send() blocks the calling thread while it waits for broker
# metadata - the client default (60s) would stall a booking request for a
# full minute if the broker is unreachable. Fail fast instead; a booking
# outcome notification is best-effort, not worth blocking the HTTP response on.
spring.kafka.producer.properties.max.block.ms=${KAFKA_PRODUCER_MAX_BLOCK_MS:3000}

spring.kafka.consumer.group-id=booking-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.booking_service.kafka.dto
